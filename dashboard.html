<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itália 2.0 | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e;
            --fundo: #0a0f0d;
            --vidro: rgba(15, 23, 20, 0.6);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--fundo);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* FUNDO ANIMADO */
        .fundo-degrade {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%);
            z-index: -2;
        }
        .grade-fundo {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
            mask-image: radial-gradient(circle at center, black 10%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%);
        }
        .particula {
            position: fixed; bottom: -10px; background-color: var(--verde);
            border-radius: 50%; box-shadow: 0 0 10px var(--verde);
            opacity: 0; animation: subir linear infinite; z-index: -1;
        }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        @keyframes subir {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; } 80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* CONTAINER */
        .container-principal {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 10;
            margin-top: 20px;
        }

        /* CARTÃO DE PERFIL */
        .cartao-perfil {
            background: var(--vidro);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }
        .cartao-perfil::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--verde); border-radius: 16px 0 0 16px;
        }

        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            border: 2px solid var(--verde); background: #000;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: bold; color: var(--verde);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            background-size: cover; background-position: center;
            flex-shrink: 0;
        }
        
        .info-perfil { flex: 1; }
        .nome { font-family: 'Oswald', sans-serif; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .cargo { font-size: 13px; color: var(--verde); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .passaporte { font-size: 12px; color: var(--texto-mutado); }
        
        .xp-container { margin-top: 10px; }
        .xp-textos { display: flex; justify-content: space-between; font-size: 10px; color: var(--texto-mutado); margin-bottom: 5px; font-weight: 500;}
        .xp-textos span:last-child { color: var(--verde); font-weight: bold;}
        .xp-barra-bg { width: 100%; height: 4px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; }
        .xp-barra-preenchida { height: 100%; background: var(--verde); width: 0%; box-shadow: 0 0 10px var(--verde); transition: width 1s ease; }

        /* MÉTRICAS */
        .grid-metricas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .card-metrica {
            background: var(--vidro);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            transition: 0.3s;
        }
        .metrica-topo {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            color: var(--texto-mutado); display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 5px;
        }
        .metrica-valor { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
        .metrica-sub { font-size: 10px; color: rgba(255,255,255,0.3); }

        /* NO CELULAR */
        @media (max-width: 600px) {
            .container-principal { gap: 10px; margin-top: 10px; }
            .cartao-perfil { padding: 15px; gap: 15px; border-radius: 12px; }
            .avatar { width: 60px; height: 60px; font-size: 24px; }
            .nome { font-size: 20px; }
            .cargo { font-size: 11px; }
            .passaporte { font-size: 10px; }
            
            .grid-metricas { gap: 8px; }
            .card-metrica { padding: 10px; border-radius: 10px; }
            .metrica-topo { font-size: 8px; flex-direction: column; align-items: flex-start; gap: 3px; }
            .metrica-topo i { display: none; } /* Esconde o ícone no celular pra não amassar */
            .metrica-valor { font-size: 22px; }
            .metrica-sub { font-size: 8px; line-height: 1.1; display: block;}
        }
    </style>
</head>
<body>
    <!-- FUNDO -->
    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>
    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>

    <main class="container-principal">
        <!-- PERFIL -->
        <div class="cartao-perfil">
            <div class="avatar" id="avatar-inicial">?</div>
            <div class="info-perfil">
                <h1 class="nome" id="nome-membro">Carregando...</h1>
                <p class="cargo" id="cargo-membro">---</p>
                <p class="passaporte">Passaporte: <span id="passaporte-membro" style="color: #fff;">---</span></p>
                
                <div class="xp-container">
                    <div class="xp-textos">
                        <span>XP</span>
                        <span id="xp-texto">0 / 1000</span>
                    </div>
                    <div class="xp-barra-bg">
                        <div class="xp-barra-preenchida" id="xp-barra"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MÉTRICAS -->
        <div class="grid-metricas">
            <div class="card-metrica">
                <div class="metrica-topo">Presenças <i class="fas fa-check-circle" style="color: #22c55e;"></i></div>
                <div class="metrica-valor" style="color: #22c55e;" id="kpi-presencas">0</div>
                <div class="metrica-sub">Registros</div>
            </div>
            
            <div class="card-metrica">
                <div class="metrica-topo">Faltas <i class="fas fa-times-circle" style="color: #ef4444;"></i></div>
                <div class="metrica-valor" style="color: #ef4444;" id="kpi-faltas">0</div>
                <div class="metrica-sub">Sem Just.</div>
            </div>

            <div class="card-metrica">
                <div class="metrica-topo">Advertências <i class="fas fa-exclamation-triangle" style="color: #eab308;"></i></div>
                <div class="metrica-valor" style="color: #eab308;" id="kpi-advertencias">0</div>
                <div class="metrica-sub">Punições</div>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';

            const membro = JSON.parse(logado);
            
            document.getElementById('nome-membro').innerText = membro.nome;
            document.getElementById('cargo-membro').innerText = membro.cargo;
            document.getElementById('passaporte-membro').innerText = membro.passaporte;
            document.getElementById('avatar-inicial').innerText = membro.nome.charAt(0).toUpperCase();

            const { data, error } = await sb.from('membros')
                .select('xp_total, foto_url, advertencias')
                .eq('passaporte', membro.passaporte)
                .single();

            if (data && !error) {
                const xp = data.xp_total || 0;
                document.getElementById('xp-texto').innerText = `${xp} / 1000`;
                let porcentagem = (xp / 1000) * 100;
                if (porcentagem > 100) porcentagem = 100;
                
                setTimeout(() => {
                    document.getElementById('xp-barra').style.width = porcentagem + "%";
                }, 300);

                document.getElementById('kpi-advertencias').innerText = data.advertencias || 0;

                if (data.foto_url) {
                    const urlLimpa = data.foto_url.replace(/["']/g, '').trim();
                    const avatar = document.getElementById('avatar-inicial');
                    avatar.style.backgroundImage = `url('${urlLimpa}')`;
                    avatar.innerText = ''; 
                }
            }
        });
    </script>
</body>
</html>
