<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a07">
    <title>Central de Comando | Portal Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-principal: #0a0f0d; 
            --texto-secundario: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            background-color: var(--fundo-principal);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
        }

        /* FUNDOS E PARTÍCULAS */
        .fundo-degrade {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.4) 0%, transparent 50%);
            z-index: 0;
        }
        .grade-fundo {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }
        .particulas { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .particula { position: absolute; bottom: -10px; background-color: var(--verde-neon); border-radius: 50%; box-shadow: 0 0 10px var(--verde-neon); opacity: 0; animation: subir linear infinite; }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        .p6 { width: 2px; height: 2px; left: 20%; animation-duration: 10s; animation-delay: 4s; }
        .p7 { width: 4px; height: 4px; left: 80%; animation-duration: 7.5s; animation-delay: 0.5s; }

        @keyframes subir {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; } 80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* PAINEL PRINCIPAL */
        .painel-hud {
            position: relative; z-index: 10; width: 95%; max-width: 600px;
            padding: 30px 25px; background: rgba(10, 15, 13, 0.85);
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 197, 94, 0.05);
            opacity: 0; transform: translateY(20px); animation: aparecer 0.8s forwards;
        }
        .painel-hud::before, .painel-hud::after {
            content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--verde-neon); z-index: 20;
        }
        .painel-hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .painel-hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }

        /* TOPO DO PAINEL */
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .tag-status {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--verde-neon);
            padding: 6px 12px; font-family: 'Oswald', sans-serif; font-size: 11px;
            letter-spacing: 2px; text-transform: uppercase; color: #86efac;
        }
        .tag-status span { width: 6px; height: 6px; background: var(--verde-neon); border-radius: 50%; box-shadow: 0 0 10px var(--verde-neon); animation: piscar 1.5s infinite; }
        .btn-sair { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: 'Oswald', sans-serif; text-transform: uppercase; transition: 0.3s;}
        .btn-sair:hover { background: rgba(239, 68, 68, 0.1); }

        /* CARTÃO DE IDENTIDADE */
        .id-card {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 10px; padding: 20px;
            display: flex; align-items: center; gap: 20px; margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(34, 197, 94, 0.05);
        }
        .avatar {
            width: 70px; height: 70px; border-radius: 8px; background: #000;
            border: 2px solid var(--verde-neon); display: flex; align-items: center; justify-content: center;
            font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: bold; color: var(--verde-neon);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }
        .info-membro h2 { font-family: 'Oswald', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .info-membro p { font-size: 13px; color: var(--texto-secundario); margin-bottom: 3px; }
        .info-membro strong { color: #fff; }
        .cargo-badge { display: inline-block; background: var(--verde-neon); color: #000; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 5px;}

        /* PAINEL DE STATUS (XP E ADVERTÊNCIAS) */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .status-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; }
        .status-box h4 { font-size: 12px; color: var(--texto-secundario); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;}
        .status-box .valor { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; color: var(--verde-neon); }
        
        .barra-progresso { width: 100%; height: 8px; background: #27272a; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .barra-preenchida { height: 100%; background: var(--verde-neon); width: 0%; box-shadow: 0 0 10px var(--verde-neon); transition: width 1s ease; }

        /* BOTÕES DE AÇÃO */
        .botoes-acao { display: flex; flex-direction: column; gap: 12px; }
        .btn-acao {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 16px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: white; font-family: 'Oswald', sans-serif; font-size: 15px;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer;
        }
        .btn-acao:hover { border-color: var(--verde-neon); background: rgba(34, 197, 94, 0.1); color: var(--verde-neon); padding-left: 20px;}
        .btn-acao i { font-size: 18px; color: #52525b; transition: 0.3s;}
        .btn-acao:hover i { color: var(--verde-neon); }

        /* MODAL DE PONTO */
        .modal-ponto { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #0a0f0d; border: 1px solid var(--verde-neon); padding: 30px; border-radius: 10px; text-align: center; max-width: 300px; width: 90%; box-shadow: 0 0 30px rgba(34,197,94,0.2); }
        .modal-content i { font-size: 50px; color: var(--verde-neon); margin-bottom: 15px; }
        .modal-content h3 { font-family: 'Oswald', sans-serif; font-size: 22px; margin-bottom: 10px; }
        .modal-content p { font-size: 13px; color: var(--texto-secundario); margin-bottom: 20px; }
        .btn-fechar-modal { background: var(--verde-neon); color: #000; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; font-family: 'Oswald', sans-serif; cursor: pointer; width: 100%; }
        
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>
    <div class="particulas">
        <div class="particula p1"></div><div class="particula p2"></div><div class="particula p3"></div><div class="particula p4"></div><div class="particula p5"></div><div class="particula p6"></div><div class="particula p7"></div>
    </div>

    <div class="painel-hud">
        
        <!-- TOPO -->
        <div class="topo">
            <div class="tag-status"><span></span> Sistema Online</div>
            <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>

        <!-- CARTÃO DE IDENTIDADE -->
        <div class="id-card">
            <div class="avatar" id="avatar-inicial">?</div>
            <div class="info-membro">
                <h2 id="info-nome">Carregando...</h2>
                <p>Passaporte: <strong id="info-passaporte">---</strong></p>
                <span class="cargo-badge" id="info-cargo">---</span>
            </div>
        </div>

        <!-- STATUS -->
        <div class="status-grid">
            <div class="status-box">
                <h4>Experiência (XP)</h4>
                <div class="valor" id="info-xp">0</div>
                <div class="barra-progresso"><div class="barra-preenchida" id="barra-xp"></div></div>
            </div>
            <div class="status-box">
                <h4>Advertências</h4>
                <div class="valor" id="info-advertencias" style="color: #ef4444;">0</div>
                <p style="font-size: 11px; color: #71717a; margin-top: 5px;">Mantenha o RP limpo.</p>
            </div>
        </div>

        <!-- AÇÕES -->
        <div class="botoes-acao">
            <button class="btn-acao" onclick="abrirModalPonto()">
                <span><i class="fas fa-clock" style="margin-right: 10px;"></i> Bater Ponto</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-acao" onclick="alert('Em breve: Lista de Membros')">
                <span><i class="fas fa-users" style="margin-right: 10px;"></i> Membros da Organização</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-acao" onclick="alert('Em breve: Painel de Metas')">
                <span><i class="fas fa-bullseye" style="margin-right: 10px;"></i> Metas Semanais</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- MODAL DE PONTO -->
    <div class="modal-ponto" id="modal-ponto">
        <div class="modal-content">
            <i class="fas fa-check-circle"></i>
            <h3>Ponto Registrado!</h3>
            <p>Seu horário foi enviado para a liderança com sucesso.</p>
            <button class="btn-fechar-modal" onclick="fecharModalPonto()">Fechar</button>
        </div>
    </div>

    <script>
        // Carrega os dados do membro logado
        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            
            if (!logado) {
                window.location.href = 'login.html';
                return;
            }

            const membro = JSON.parse(logado);
            
            // Preenche o básico que já temos na sessão
            document.getElementById('info-nome').innerText = membro.nome;
            document.getElementById('info-passaporte').innerText = membro.passaporte;
            document.getElementById('info-cargo').innerText = membro.cargo;
            document.getElementById('avatar-inicial').innerText = membro.nome.charAt(0).toUpperCase();

            // Puxa os dados atualizados direto do banco (XP e Advertências)
            const { data, error } = await sb.from('membros')
                .select('xp_total, advertencias')
                .eq('passaporte', membro.passaporte)
                .single();

            if (data && !error) {
                const xp = data.xp_total || 0;
                document.getElementById('info-xp').innerText = xp + " XP";
                document.getElementById('info-advertencias').innerText = data.advertencias || 0;

                // Lógica da barra: ex: 1000 XP = 100%
                let porcentagem = (xp / 1000) * 100;
                if (porcentagem > 100) porcentagem = 100;
                document.getElementById('barra-xp').style.width = porcentagem + "%";
            }
        });

        function sair() {
            sessionStorage.removeItem('membro_logado');
            window.location.href = 'login.html';
        }

        function abrirModalPonto() {
            // Aqui no futuro a gente insere na tabela 'pontos'
            document.getElementById('modal-ponto').style.display = 'flex';
        }

        function fecharModalPonto() {
            document.getElementById('modal-ponto').style.display = 'none';
        }
    </script>
</body>
</html>
