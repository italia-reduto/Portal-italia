<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Itália | Whitelist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-principal: #0a0f0d; 
            --texto-secundario: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            background-color: var(--fundo-principal);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* FUNDO DEGRADÊ */
        .fundo-degrade {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 0.5) 0%, transparent 100%);
            z-index: 0;
        }

        /* GRADE TÁTICA */
        .grade-fundo {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        /* =========================================
           PARTÍCULAS ANIMADAS (Efeito de Fundo Vivo)
           ========================================= */
        .particulas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particula {
            position: absolute;
            bottom: -10px;
            background-color: var(--verde-neon);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--verde-neon);
            opacity: 0;
            animation: subir linear infinite;
        }

        /* Criando as partículas com tamanhos, posições e tempos diferentes */
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        .p6 { width: 2px; height: 2px; left: 20%; animation-duration: 10s; animation-delay: 4s; }
        .p7 { width: 4px; height: 4px; left: 80%; animation-duration: 7.5s; animation-delay: 0.5s; }

        @keyframes subir {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* =========================================
           PAINEL HUD
           ========================================= */
        .painel-hud {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            padding: 40px 25px;
            background: rgba(10, 15, 13, 0.7);
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 197, 94, 0.05);
            opacity: 0;
            transform: translateY(20px);
            animation: aparecer 0.8s forwards;
        }

        .painel-hud::before, .painel-hud::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--verde-neon);
        }
        .painel-hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .painel-hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .tag-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            border-left: 3px solid var(--verde-neon);
            padding: 6px 12px;
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #86efac;
            margin-bottom: 25px;
        }
        .tag-status span {
            width: 6px; height: 6px;
            background: var(--verde-neon);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--verde-neon);
            animation: piscar 1.5s infinite;
        }

        .titulo {
            font-family: 'Oswald', sans-serif;
            font-size: 52px;
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .titulo span {
            display: block;
            color: var(--verde-neon);
            -webkit-text-fill-color: var(--verde-neon);
            font-size: 22px;
            letter-spacing: 5px;
            margin-top: 5px;
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .divisoria {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--verde-neon) 0%, transparent 100%);
            margin: 20px 0;
            opacity: 0.3;
        }

        .descricao {
            font-size: 13px;
            color: var(--texto-secundario);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* BOTÃO PRINCIPAL */
        .btn-principal {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 15px; /* Espaço para o link de registro */
        }

        .btn-principal::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--verde-neon);
            transition: 0.4s;
            z-index: -1;
        }

        .btn-principal:hover::before, .btn-principal:active::before { left: 0; }
        .btn-principal:hover, .btn-principal:active { border-color: var(--verde-neon); color: #000; font-weight: 700; padding-left: 25px; }

        /* LINK DE REGISTRO (OPÇÃO 1) */
        .link-registro {
            display: block;
            text-align: center;
            font-size: 12px;
            color: #71717a;
            text-decoration: none;
            margin-bottom: 30px;
            transition: 0.3s;
        }

        .link-registro strong {
            color: var(--verde-neon);
            cursor: pointer;
        }

        .link-registro:hover strong {
            text-decoration: underline;
        }

        /* ÁREA DE REDES SOCIAIS */
        .redes-sociais {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-social.discord:hover { background: rgba(88, 101, 242, 0.15); border-color: #5865F2; color: #5865F2; transform: translateY(-5px); }
        .btn-social.instagram:hover { background: rgba(225, 48, 108, 0.15); border-color: #E1306C; color: #E1306C; transform: translateY(-5px); }

        .rodape {
            position: absolute;
            bottom: 15px;
            text-align: center;
            font-size: 10px;
            color: #3f3f46;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 10;
        }

        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>

    <!-- PARTÍCULAS DE FUNDO -->
    <div class="particulas">
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
        <div class="particula p5"></div>
        <div class="particula p6"></div>
        <div class="particula p7"></div>
    </div>

    <div class="painel-hud">
        <div class="tag-status">
            <span></span> Whitelist Aberta
        </div>

        <h1 class="titulo">
            Portal<br>Itália
            <span>Roleplay</span>
        </h1>

        <div class="divisoria"></div>

        <p class="descricao">
            Acesse a central de comando oficial. Gerencie sua equipe, registre seu ponto e acompanhe sua evolução na organização.
        </p>

        <!-- Botão Principal -->
        <a href="login.html" class="btn-principal">
            Acessar Sistema
            <i class="fas fa-chevron-right"></i>
        </a>

        <!-- Link de Registro (Opção 1) -->
        <a href="registro.html" class="link-registro">
            Ainda não tem acesso? <strong>Faça sua Whitelist aqui</strong>
        </a>

        <!-- Redes Sociais -->
        <div class="redes-sociais">
            <a href="LINK_DO_SEU_DISCORD" target="_blank" class="btn-social discord">
                <i class="fab fa-discord"></i>
            </a>
            <a href="LINK_DO_SEU_INSTAGRAM" target="_blank" class="btn-social instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>

    <div class="rodape">
        &copy; 2026 Organização Itália
    </div>

</body>
</html>
