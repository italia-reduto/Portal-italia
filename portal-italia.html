<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Itália - LABORATÓRIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #0f291b 0%, #050a07 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .fundo-luz {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(34, 197, 94, 0.2) 0%, transparent 70%);
            z-index: 0;
        }

        /* IMAGEM DO BONECO (Vai ser controlada pelo JS) */
        .boneco-img {
            position: absolute;
            z-index: 1;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.4));
            /* Valores iniciais */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 100vh;
        }

        /* TEXTOS (Ficam fixos pra você ver se o boneco atrapalha) */
        .area-texto {
            position: absolute; z-index: 10; text-align: center;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; display: flex; flex-direction: column; align-items: center;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.9);
            pointer-events: none;
        }
        .titulo-principal { font-size: 60px; font-weight: 900; color: #fff; line-height: 1; }
        .subtitulo { font-size: 14px; color: #86efac; margin-bottom: 30px; }

        /* =========================================
           PAINEL DE CONTROLE (Só pra você testar)
           ========================================= */
        .painel-controle {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #22c55e;
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .painel-controle label { font-size: 12px; font-weight: bold; color: #86efac; }
        .painel-controle input[type="range"] { width: 100%; }
    </style>
</head>
<body>

    <div class="fundo-luz"></div>

    <!-- A imagem -->
    <img src="ei_1793336030505-removebg-preview.png" id="boneco" class="boneco-img">

    <!-- Texto -->
    <div class="area-texto">
        <h1 class="titulo-principal">PORTAL ITÁLIA</h1>
        <p class="subtitulo">Sua jornada começa aqui</p>
    </div>

    <!-- PAINEL DE CONTROLE -->
    <div class="painel-controle">
        <div>
            <label>Tamanho (Altura): <span id="val-tamanho">100</span>%</label>
            <input type="range" id="slider-tamanho" min="50" max="200" value="100" oninput="mudarTamanho(this.value)">
        </div>
        <div>
            <label>Posição Y (Cima/Baixo): <span id="val-y">50</span>%</label>
            <input type="range" id="slider-y" min="0" max="100" value="50" oninput="mudarPosicaoY(this.value)">
        </div>
        <div>
            <label>Posição X (Esquerda/Direita): <span id="val-x">50</span>%</label>
            <input type="range" id="slider-x" min="0" max="100" value="50" oninput="mudarPosicaoX(this.value)">
        </div>
    </div>

    <script>
        const boneco = document.getElementById('boneco');

        // Função pra mudar o tamanho
        function mudarTamanho(valor) {
            document.getElementById('val-tamanho').innerText = valor;
            // O vh significa "altura da tela". 100vh = tela toda.
            boneco.style.height = valor + 'vh';
        }

        // Função pra mover pra cima/baixo
        function mudarPosicaoY(valor) {
            document.getElementById('val-y').innerText = valor;
            boneco.style.top = valor + '%';
        }

        // Função pra mover pra esquerda/direita
        function mudarPosicaoX(valor) {
            document.getElementById('val-x').innerText = valor;
            boneco.style.left = valor + '%';
        }
    </script>
</body>
</html>
