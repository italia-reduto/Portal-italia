<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Itália - LABORATÓRIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #0f291b 0%, #050a07 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .fundo-luz {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(34, 197, 94, 0.2) 0%, transparent 70%);
            z-index: 0;
        }

        /* IMAGEM DO BONECO (Controlada pelos sliders) */
        .boneco-img {
            position: absolute;
            z-index: 1;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.4));
            /* Posição inicial (Centro) */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 100vh;
        }

        /* TEXTOS NA ESQUERDA (Do jeito que você queria) */
        .area-texto {
            position: absolute;
            top: 50%;
            left: 25px; 
            transform: translateY(-50%);
            z-index: 10;
            width: 55vw;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.9);
        }

        .titulo-principal {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 12px;
            font-weight: 700;
            color: #86efac;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .botao-entrar {
            display: inline-block;
            padding: 15px 25px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(135deg, #166534 0%, #22c55e 100%);
            border: 1px solid rgba(34, 197, 94, 0.5);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
            pointer-events: auto;
        }

        /* PAINEL DE CONTROLE (COMPACTO PARA MOBILE) */
        .painel-controle {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #22c55e;
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 35vh;
            overflow-y: auto;
        }
        .controle-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .controle-linha label { font-size: 11px; color: #86efac; min-width: 100px;}
        .controle-linha input[type="range"] { flex: 1; }
        .controle-linha span { font-size: 11px; color: #fff; min-width: 35px; text-align: right; }
    </style>
</head>
<body>

    <div class="fundo-luz"></div>

    <!-- A Imagem -->
    <img src="ei_1793336030505-removebg-preview.png" id="boneco" class="boneco-img">

    <!-- Textos e Botão na Esquerda -->
    <div class="area-texto">
        <h1 class="titulo-principal">Portal<br>Itália</h1>
        <p class="subtitulo">Sua jornada começa aqui</p>
        <a href="login.html" class="botao-entrar">ACESSAR O SISTEMA</a>
    </div>

    <!-- PAINEL DE CONTROLE -->
    <div class="painel-controle">
        <div class="controle-linha">
            <label>Tamanho:</label>
            <input type="range" id="slider-tamanho" min="50" max="250" value="100" oninput="mudarTamanho(this.value)">
            <span id="val-tamanho">100</span>
        </div>
        <div class="controle-linha">
            <label>Altura (Y):</label>
            <input type="range" id="slider-y" min="0" max="100" value="50" oninput="mudarPosicaoY(this.value)">
            <span id="val-y">50</span>
        </div>
        <div class="controle-linha">
            <label>Lado (X):</label>
            <input type="range" id="slider-x" min="-50" max="150" value="50" oninput="mudarPosicaoX(this.value)">
            <span id="val-x">50</span>
        </div>
    </div>

    <script>
        const boneco = document.getElementById('boneco');

        function mudarTamanho(valor) {
            document.getElementById('val-tamanho').innerText = valor;
            boneco.style.height = valor + 'vh';
        }

        function mudarPosicaoY(valor) {
            document.getElementById('val-y').innerText = valor;
            boneco.style.top = valor + '%';
        }

        function mudarPosicaoX(valor) {
            document.getElementById('val-x').innerText = valor;
            boneco.style.left = valor + '%';
        }
    </script>
</body>
</html>
