<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at center, #0f291b 0%, #050a07 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .fundo-luz {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(34, 197, 94, 0.2) 0%, transparent 70%);
            z-index: 0;
        }

        /* =========================================
           IMAGEM DO BONECO (Com suas medidas)
           ========================================= */
        .boneco-img {
            position: absolute;
            z-index: 1;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.4));
            
            /* Medidas exatas que você achou */
            height: 91vh;
            top: 67%;
            left: 88%;
            transform: translate(-50%, -50%); 
            
            /* Tenta forçar o celular a renderizar em alta qualidade */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: auto;
        }

        /* =========================================
           TEXTOS NA ESQUERDA
           ========================================= */
        .area-texto {
            position: absolute;
            top: 50%;
            left: 25px; 
            transform: translateY(-50%);
            z-index: 10;
            width: 55vw;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.9);
        }

        .titulo-principal {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 12px;
            font-weight: 700;
            color: #86efac;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .botao-entrar {
            display: inline-block;
            padding: 15px 25px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(135deg, #166534 0%, #22c55e 100%);
            border: 1px solid rgba(34, 197, 94, 0.5);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
            transition: all 0.3s ease;
        }

        .botao-entrar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(34, 197, 94, 0.6);
            background: linear-gradient(135deg, #22c55e 0%, #4ade80 100%);
        }

    </style>
</head>
<body>

    <div class="fundo-luz"></div>

    <!-- A Imagem Posicionada -->
    <img src="ei_1793336030505-removebg-preview.png" alt="Personagem" class="boneco-img">

    <!-- Textos e Botão na Esquerda -->
    <div class="area-texto">
        <h1 class="titulo-principal">Portal<br>Itália</h1>
        <p class="subtitulo">Sua jornada começa aqui</p>
        <a href="login.html" class="botao-entrar">ACESSAR O SISTEMA</a>
    </div>

</body>
</html>
