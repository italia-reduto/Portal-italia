<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Fundo verde escuro */
            background: radial-gradient(circle at center, #0f291b 0%, #050a07 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Luz verde suave no fundo */
        .fundo-luz {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 80%, rgba(34, 197, 94, 0.15) 0%, transparent 60%);
            z-index: 0;
        }

        /* =========================================
           CONTAINER DO BONECO (FIXO NA DIREITA)
           ========================================= */
        .container-boneco {
            position: absolute;
            bottom: 0;       /* Cola no chão */
            right: 0;        /* Cola na direita */
            height: 85vh;    /* Altura do boneco (85% da tela) */
            width: 60vw;     /* Largura limite para não cobrir o texto */
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .boneco-img {
            height: 100%;
            width: 100%;
            object-fit: contain;         /* Não estica a imagem */
            object-position: bottom right; /* Ancora no canto inferior direito */
            filter: drop-shadow(0 0 30px rgba(34, 197, 94, 0.3));
            animation: flutuar 5s ease-in-out infinite; /* Animação de respiração */
        }

        /* =========================================
           TEXTOS E BOTÃO (NA ESQUERDA)
           ========================================= */
        .area-texto {
            position: absolute;
            top: 50%;
            left: 30px; /* Distância da borda esquerda */
            transform: translateY(-50%);
            z-index: 10;
            max-width: 220px; /* Garante que o texto não invada a imagem */
        }

        .titulo-principal {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateX(-20px);
            animation: aparecer 1s 0.3s forwards;
        }

        .subtitulo {
            font-size: 12px;
            font-weight: 700;
            color: #86efac;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
            opacity: 0;
            transform: translateX(-20px);
            animation: aparecer 1s 0.6s forwards;
        }

        .botao-entrar {
            display: inline-block;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(135deg, #166534 0%, #22c55e 100%);
            border: 1px solid rgba(34, 197, 94, 0.5);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateX(-20px);
            animation: aparecer 1s 0.9s forwards;
        }

        .botao-entrar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(34, 197, 94, 0.6);
            background: linear-gradient(135deg, #22c55e 0%, #4ade80 100%);
        }

        /* Animações */
        @keyframes aparecer {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes flutuar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="fundo-luz"></div>

    <!-- Textos na Esquerda -->
    <div class="area-texto">
        <h1 class="titulo-principal">Portal<br>Itália</h1>
        <p class="subtitulo">Sua jornada começa aqui</p>
        <a href="login.html" class="botao-entrar">ACESSAR O SISTEMA</a>
    </div>

    <!-- Boneco na Direita -->
    <div class="container-boneco">
        <!-- SUBSTITUA O NOME DO ARQUIVO SE NECESSÁRIO -->
        <img src="boneco.png" alt="Personagem" class="boneco-img">
    </div>

</body>
</html>
