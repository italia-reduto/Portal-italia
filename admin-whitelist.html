<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a07">
    <title>Admin Whitelist | Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-principal: #0a0f0d; 
            --texto-secundario: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            background-color: var(--fundo-principal);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .fundo-degrade {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.4) 0%, transparent 50%);
            z-index: 0;
        }

        .grade-fundo {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* PAINEL DE LOGIN (Só aparece se não estiver logado) */
        .painel-login {
            position: relative; z-index: 10; width: 90%; max-width: 350px;
            padding: 40px 25px; background: rgba(10, 15, 13, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .titulo { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; color: white; margin-bottom: 20px;}
        .campo-grupo { margin-bottom: 15px; text-align: left;}
        .campo-grupo label { font-size: 12px; font-weight: 600; color: #86efac; text-transform: uppercase;}
        .campo-grupo input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid #334155; border-radius: 6px; color: white; outline: none;}
        .btn-principal { width: 100%; padding: 15px; background: var(--verde-neon); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        
        /* ÁREA DO ADMIN (Só aparece se o login for válido) */
        .painel-admin {
            display: none; position: relative; z-index: 10; width: 95%; max-width: 600px;
            padding: 20px; background: rgba(10, 15, 13, 0.9);
            border: 1px solid rgba(34, 197, 94, 0.3);
            max-height: 90vh; overflow-y: auto;
        }
        
        .topo-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        
        .card-ficha {
            background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 8px;
            padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        
        .ficha-dados { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
        .ficha-dados strong { color: white; }
        
        .ficha-acoes { display: flex; gap: 10px; margin-top: 10px; }
        .input-senha { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #000; color: white; outline: none;}
        
        .btn-aprovar { background: #22c55e; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-recusar { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .btn-sair { background: transparent; color: #f87171; border: none; cursor: pointer; font-size: 14px;}
    </style>
</head>
<body>

    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>

    <!-- TELA DE LOGIN -->
    <div class="painel-login" id="tela-login">
        <h1 class="titulo">Acesso Restrito</h1>
        <div class="campo-grupo">
            <label>Passaporte de Liderança</label>
            <input type="number" id="login-pass" placeholder="Ex: 17274">
        </div>
        <div class="campo-grupo">
            <label>Senha</label>
            <input type="password" id="login-senha" placeholder="Sua senha">
        </div>
        <button class="btn-principal" onclick="fazerLoginAdmin()">Entrar</button>
    </div>

    <!-- TELA DO ADMIN -->
    <div class="painel-admin" id="tela-admin">
        <div class="topo-admin">
            <h2 style="font-family: Oswald; color: white; font-size: 24px;">Fichas Pendentes</h2>
            <button class="btn-sair" onclick="sairAdmin()"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
        <div id="lista-fichas"></div>
    </div>

    <script>
        // 1. Lógica de Login
        async function fazerLoginAdmin() {
            const pass = document.getElementById('login-pass').value;
            const senha = document.getElementById('login-senha').value;

            if (!pass || !senha) { alert("Preencha tudo!"); return; }

            // Procura o membro no banco
            const { data, error } = await sb.from('membros')
                .select('cargo, senha') // Supondo que sua tabela membros tenha a coluna 'senha'
                .eq('passaporte', pass)
                .single();

            if (error || !data) {
                alert("Passaporte não encontrado!");
                return;
            }

            // Checa os cargos permitidos
            const cargosPermitidos = ['Líder da organização', '01 da organização', 'Coordenador', 'Gerente geral', 'Gerente'];
            if (!cargosPermitidos.includes(data.cargo)) {
                alert("Você não tem permissão para acessar esta área.");
                return;
            }

            // Verifica a senha (Aqui assume-se que a senha salva é texto puro, se for hash, precisa mudar)
            if (data.senha !== senha) {
                alert("Senha incorreta!");
                return;
            }

            // Se passou, mostra a tela do admin
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-admin').style.display = 'block';
            carregarFichas();
        }

        function sairAdmin() {
            document.getElementById('tela-admin').style.display = 'none';
            document.getElementById('tela-login').style.display = 'block';
            document.getElementById('login-pass').value = '';
            document.getElementById('login-senha').value = '';
        }

        // 2. Carregar Fichas
        async function carregarFichas() {
            const container = document.getElementById('lista-fichas');
            container.innerHTML = '<p style="color:#64748b; text-align:center;">Buscando fichas...</p>';

            const { data, error } = await sb.from('registros_whitelist')
                .select('*')
                .eq('status', 'pendente')
                .order('criado_em', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color:red;">Erro: ${error.message}</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center;">Nenhuma ficha pendente no momento.</p>';
                return;
            }

            container.innerHTML = data.map(ficha => `
                <div class="card-ficha">
                    <div class="ficha-dados">
                        <p><strong>Nome:</strong> ${ficha.nome}</p>
                        <p><strong>Passaporte:</strong> ${ficha.passaporte}</p>
                        <p><strong>Idade:</strong> ${ficha.idade}</p>
                        <p><strong>Experiência:</strong> ${ficha.experiencia}</p>
                        <p style="margin-top:8px;"><strong>História:</strong><br> ${ficha.historia}</p>
                    </div>
                    <div class="ficha-acoes">
                        <input type="text" class="input-senha" id="senha-${ficha.id}" placeholder="Definir senha do jogador">
                        <button class="btn-aprovar" onclick="aprovarFicha(${ficha.id}, '${ficha.nome}', '${ficha.passaporte}')">Aprovar</button>
                        <button class="btn-recusar" onclick="recusarFicha(${ficha.id})">Recusar</button>
                    </div>
                </div>
            `).join('');
        }

        // 3. Aprovar Ficha
        async function aprovarFicha(id, nome, passaporte) {
            const senhaCriada = document.getElementById(`senha-${id}`).value;

            if (!senhaCriada) {
                alert("Você precisa digitar uma senha para aprovar este jogador!");
                return;
            }

            if (!confirm(`Aprovar ${nome}? A conta será criada com a senha: ${senhaCriada}`)) return;

            // Passo A: Cria o jogador na tabela oficial 'membros'
            // Ajuste os campos de acordo com as colunas da SUA tabela membros
            const { error: erroCriar } = await sb.from('membros').insert([{
                nome: nome,
                passaporte: passaporte,
                cargo: 'Novato', // Cargo inicial
                senha: senhaCriada, // A senha que você digitou
                xp_total: 0,
                advertencias: 0
            }]);

            if (erroCriar) {
                alert("Erro ao criar conta: " + erroCriar.message);
                return;
            }

            // Passo B: Atualiza o status da ficha para 'aprovado'
            await sb.from('registros_whitelist').update({ status: 'aprovado', senha_criada: senhaCriada }).eq('id', id);
            
            alert(`${nome} aprovado com sucesso!`);
            carregarFichas(); // Recarrega a lista
        }

        // 4. Recusar Ficha
        async function recusarFicha(id) {
            if (!confirm("Tem certeza que deseja recusar esta ficha?")) return;
            
            await sb.from('registros_whitelist').update({ status: 'recusado' }).eq('id', id);
            carregarFichas();
        }
    </script>
</body>
  </html>
